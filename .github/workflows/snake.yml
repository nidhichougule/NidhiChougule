name: Generate Pink Snake 

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: nidhichougule

          outputs: |
            dist/snake-pink.svg?palette=github-light&color_snake=%23F7CAD0&color_dots=%23FFF0F5,%23FDE2E4,%23F7CAD0,%23E8D5F2,%23C9A7EB

            dist/snake-pink-dark.svg?palette=github-dark&color_snake=%23F7CAD0&color_dots=%232D1B33,%234A2C4A,%23C9A7EB,%23E8D5F2,%23F7CAD0

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
